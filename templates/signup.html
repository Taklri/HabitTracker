<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-stone-100 via-emerald-50 to-stone-200 text-slate-800 flex items-center justify-center px-4">
    <main class="w-full max-w-md rounded-3xl border border-stone-200 bg-white/95 p-8 shadow-2xl shadow-slate-900/10 backdrop-blur">
        <h1 class="text-3xl font-bold tracking-tight text-slate-900">Create account</h1>
        <p class="mt-2 text-sm text-slate-500">Sign up to start tracking your habits.</p>

        <form action="/signup/process" method="POST" class="mt-8 space-y-5">
            <div>
                <label for="username" class="mb-2 block text-sm font-semibold text-slate-700">Username</label>
                <input id="username" name="username" type="text" placeholder="Choose a username" required class="w-full rounded-xl border border-stone-300 px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-emerald-600 focus:ring-4 focus:ring-emerald-600/10">
            </div>

            <div>
                <label for="email" class="mb-2 block text-sm font-semibold text-slate-700">Email</label>
                <input id="email" name="email" type="email" placeholder="Enter your email" required class="w-full rounded-xl border border-stone-300 px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-emerald-600 focus:ring-4 focus:ring-emerald-600/10">
            </div>

            <div>
                <label for="password" class="mb-2 block text-sm font-semibold text-slate-700">Password</label>
                <input id="password" name="password" type="password" placeholder="Create a password" required class="w-full rounded-xl border border-stone-300 px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-emerald-600 focus:ring-4 focus:ring-emerald-600/10">
            </div>

              <div>
                <label for="re-enter_password" class="mb-2 block text-sm font-semibold text-slate-700">Re-enter Password</label>
                <input id="re-enter_password" name="reenterpass" type="password" placeholder="Re-enter password" required class="w-full rounded-xl border border-stone-300 px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-emerald-600 focus:ring-4 focus:ring-emerald-600/10">
            </div>

            <button type="submit" class="w-full rounded-xl bg-emerald-700 px-4 py-3 font-semibold text-white transition hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-600/20">Sign Up</button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-500">
            Already have an account?
            <a href="/" class="font-semibold text-emerald-700 hover:text-emerald-800">Log in</a>
        </p>
    </main>
</body>
</html>
