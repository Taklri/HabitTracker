<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-900 text-zinc-100 px-4 py-10">
    <main class="mx-auto w-full max-w-2xl rounded-3xl border border-zinc-800 bg-zinc-850/80 p-8 shadow-2xl shadow-black/30">
        <div class="flex items-center justify-between gap-4">
            <div>
                <p class="text-xs uppercase tracking-[0.22em] text-zinc-500">Profile</p>
                <h1 class="mt-2 text-2xl font-semibold text-zinc-50">Update your details, {{ username }}</h1>
                <p class="mt-2 text-sm text-zinc-400">Edit your username, password, and profile icon from the free options below.</p>
            </div>
            <a href="/dashboard" class="inline-flex rounded-lg border border-zinc-700 px-4 py-2 text-sm font-medium text-zinc-300 transition hover:border-zinc-600 hover:text-zinc-100">
                Back
            </a>
        </div>

        {% if error %}
        <p class="mt-6 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-300">{{ error }}</p>
        {% endif %}

        <form action="/profile/process" method="POST" class="mt-8 space-y-6">
            <div>
                <label for="username" class="mb-2 block text-sm font-medium text-zinc-300">Username</label>
                <input id="username" name="username" type="text" value="{{ username }}" required class="w-full rounded-xl border border-zinc-700 bg-zinc-950/60 px-4 py-3 text-zinc-100 outline-none transition placeholder:text-zinc-500 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10">
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label for="password" class="mb-2 block text-sm font-medium text-zinc-300">New Password</label>
                    <input id="password" name="password" type="password" placeholder="Leave blank to keep current password" class="w-full rounded-xl border border-zinc-700 bg-zinc-950/60 px-4 py-3 text-zinc-100 outline-none transition placeholder:text-zinc-500 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10">
                </div>
                <div>
                    <label for="reenterpass" class="mb-2 block text-sm font-medium text-zinc-300">Re-enter Password</label>
                    <input id="reenterpass" name="reenterpass" type="password" placeholder="Confirm new password" class="w-full rounded-xl border border-zinc-700 bg-zinc-950/60 px-4 py-3 text-zinc-100 outline-none transition placeholder:text-zinc-500 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 sm:grid-cols-5">
                {% for avatar in allowed_avatars %}
                <label class="cursor-pointer">
                    <input type="radio" name="avatar" value="{{ avatar }}" class="peer sr-only" {% if avatar == selected_avatar %}checked{% endif %}>
                    <span class="block rounded-2xl border border-zinc-700 bg-zinc-900/60 p-3 transition peer-checked:border-emerald-500 peer-checked:ring-2 peer-checked:ring-emerald-500/30 hover:border-zinc-500">
                        <img src="/avatars/{{ avatar }}.png" alt="{{ avatar }} avatar" class="mx-auto h-14 w-14 object-contain">
                        <span class="mt-2 block text-center text-xs font-medium uppercase tracking-wide text-zinc-400">{{ avatar }}</span>
                    </span>
                </label>
                {% endfor %}
            </div>

            <button type="submit" class="inline-flex rounded-xl bg-emerald-500 px-5 py-2.5 text-sm font-semibold text-zinc-950 transition hover:bg-emerald-400">
                Save Changes
            </button>
        </form>
    </main>
</body>
</html>
