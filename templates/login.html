<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HabitUp — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-zinc-900 text-zinc-100 flex items-center justify-center px-4">

  <main class="w-full max-w-sm">

    <div class="flex items-center justify-center gap-2 mb-10">
      <span class="text-6xl font-bold tracking-tight text-zinc-100">HabitUp</span>
    </div>

    <div class="bg-zinc-800 border border-zinc-700/60 rounded-2xl p-8 shadow-xl shadow-black/30">

      <h1 class="text-xl font-semibold tracking-tight text-zinc-100">Welcome back</h1>
      <p class="mt-1 text-sm text-zinc-500">Log in to continue tracking your habits.</p>

      <form action="/login/process" method="POST" class="mt-7 space-y-4">

        <div class="space-y-1.5">
          <label for="username" class="block text-xs font-medium tracking-wide uppercase text-zinc-500">Username</label>
          <input id="username" name="username" type="text" required
            class="w-full bg-zinc-900 border border-zinc-700 hover:border-zinc-600 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/30 text-zinc-100 text-sm placeholder-zinc-600 rounded-xl px-4 py-3 outline-none transition-all" />
        </div>

        <div class="space-y-1.5">
          <label for="password" class="block text-xs font-medium tracking-wide uppercase text-zinc-500">Password</label>
          <input id="password" name="password" type="password" required
            class="w-full bg-zinc-900 border border-zinc-700 hover:border-zinc-600 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/30 text-zinc-100 text-sm placeholder-zinc-600 rounded-xl px-4 py-3 outline-none transition-all" />
        </div>

        <button type="submit"
          class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 text-sm font-semibold py-3 rounded-xl transition-all hover:-translate-y-0.5 shadow-lg shadow-emerald-500/20 mt-2">
          Log In
        </button>

      </form>
    </div>

    <p class="mt-5 text-center text-sm text-zinc-500">
      No account?
      <a href="/signup" class="font-semibold text-emerald-400 hover:text-emerald-300 transition-colors">Create one</a>
    </p>

  </main>
</body>
</html>
